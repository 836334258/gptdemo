model_list:
  - model_name: chat-default
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GOOGLE_API_KEY
      timeout: 120
  - model_name: context-compressor
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GOOGLE_API_KEY
      timeout: 90

router_settings:
  num_retries: 2
  retry_after: 2
  routing_strategy: simple-shuffle

litellm_settings:
  drop_params: true
  request_timeout: 120
  # 成功和失败都导出 OTEL span，Phoenix 才能同时看到延迟、token、异常和模型元数据。
  success_callback: ["otel"]
  failure_callback: ["otel"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
