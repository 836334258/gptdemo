[project]
name = "open-rag-ingestion"
version = "0.1.0"
description = "Durable document ingestion worker for Open RAG Chat"
requires-python = ">=3.12,<3.14"
dependencies = [
  "docling==2.119.0",
  "httpx==0.28.1",
  "llama-index-core==0.14.23",
  "psycopg[binary,pool]==3.3.4",
  "pydantic-settings==2.15.0",
  "structlog==25.5.0",
]

[project.scripts]
rag-ingestion-worker = "open_rag_ingestion.main:main"
rag-operations-worker = "open_rag_ingestion.operations:run_operations"

[dependency-groups]
dev = [
  "mypy==1.19.1",
  "pytest==9.0.2",
  "ruff==0.15.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_rag_ingestion"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
