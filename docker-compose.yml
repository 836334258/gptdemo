name: open-rag-chat

services:
  valkey:
    image: valkey/valkey:8.1.3-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  phoenix-init:
    image: busybox:1.37.0-musl
    user: "0:0"
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - phoenix-data:/data
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      phoenix:
        condition: service_started
    ports:
      - "4000:4000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:-local-dev-key}
      # LiteLLM 使用 OTLP/HTTP 将每次模型成功与失败调用写入本地 Phoenix。
      OTEL_EXPORTER: otlp_http
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-open-rag-litellm}
      OTEL_ENVIRONMENT_NAME: ${OTEL_ENVIRONMENT_NAME:-local}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro

  phoenix:
    image: arizephoenix/phoenix:latest-nonroot
    depends_on:
      phoenix-init:
        condition: service_completed_successfully
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
      PHOENIX_TELEMETRY_ENABLED: "false"
    volumes:
      - phoenix-data:/data

  embedding:
    profiles: ["models"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    # CPU TEI 默认会以 16384 batch tokens 和大量 tokenizer worker 预热，
    # BGE-M3 在 Docker Desktop 15 GiB 限额下会瞬时占用约 12 GiB 并被 137 终止。
    # 知识库 chunk 远小于 2048 tokens，收紧动态批处理不改变模型或 1024 维向量。
    command:
      - "--model-id"
      - "BAAI/bge-m3"
      - "--port"
      - "80"
      - "--max-batch-tokens"
      - "2048"
      - "--max-concurrent-requests"
      - "32"
      - "--tokenization-workers"
      - "2"
    ports:
      - "8081:80"
    volumes:
      - model-cache:/data

  reranker:
    profiles: ["models"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - "--model-id"
      - "Alibaba-NLP/gte-multilingual-reranker-base"
      - "--port"
      - "80"
      - "--max-batch-tokens"
      - "2048"
      - "--max-concurrent-requests"
      - "16"
      - "--tokenization-workers"
      - "2"
    ports:
      - "8082:80"
    volumes:
      - model-cache:/data

volumes:
  valkey-data:
  phoenix-data:
  model-cache:
